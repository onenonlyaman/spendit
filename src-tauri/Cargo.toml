[package]
name = "SpendIt"
version = "1.1.0"
description = "SpendIt — Personal Financial Diary"

authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

# Optimize compilation speed for 3rd-party dependencies
[profile.dev.package."*"]
opt-level = 2
debug = false

# Production release: strip symbols to slash linking time & binary weight
[profile.release]
opt-level = 3
debug = false
strip = true
lto = "thin"
codegen-units = 1
